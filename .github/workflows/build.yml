name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\gpa_windows.sln

      - name: Build
        run: dotnet build .\gpa_windows.sln -c Release --no-restore

      - name: Publish single-file EXE
        run: dotnet publish .\src\GpaWindows\GpaWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GPA-Windows-win-x64
          path: .\artifacts\publish\GpaWindows.exe
          if-no-files-found: error
